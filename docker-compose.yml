services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: snap_dev
      MYSQL_USER: snap
      MYSQL_PASSWORD: snap
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "snap", "-psnap"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      FLASK_APP: wsgi.py
      FLASK_ENV: development
      DATABASE_URL: mysql+pymysql://snap:snap@db:3306/snap_dev
      SECRET_KEY: dev-secret-key-change-in-production
      APP_VERSION: "0.1.0"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: flask run --host=0.0.0.0

volumes:
  mysql_data:
